<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">NYXA Identity</title>
<desc id="d">Aperçu de NYXA Identity, un parcours pédagogique sur l’identité numérique et la protection des comptes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8f1e8"/>
    <stop offset=".6" stop-color="#efe2d5"/>
    <stop offset="1" stop-color="#f6ece3"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#2e7c70"/>
    <stop offset=".55" stop-color="#c56d2f"/>
    <stop offset="1" stop-color="#8a3f59"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#52301f" flood-opacity=".14"/>
  </filter>
</defs>

<rect width="1200" height="675" rx="40" fill="url(#bg)"/>
<circle cx="110" cy="70" r="180" fill="#c56d2f" opacity=".10"/>
<circle cx="1100" cy="70" r="210" fill="#8a3f59" opacity=".08"/>

<g font-family="Arial,Helvetica,sans-serif">
  <text x="82" y="112" font-size="22" font-weight="700" fill="#2e7c70">IDENTITÉ NUMÉRIQUE</text>
  <text x="82" y="188" font-size="64" font-weight="800" fill="#2f1f1a">Votre e-mail est</text>
  <text x="82" y="258" font-size="64" font-weight="800" fill="url(#acc)">souvent une clé.</text>
  <text x="82" y="308" font-size="24" fill="#7a655c">Comprendre • compartimenter • protéger</text>
</g>

<g transform="translate(730 82)" filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif">
  <rect x="0" y="0" width="385" height="500" rx="30" fill="#fffaf5" stroke="#4b2c22" stroke-opacity=".10"/>
  <rect x="84" y="58" width="217" height="132" rx="28" fill="#f2e5d8" stroke="#2e7c70" stroke-opacity=".25"/>
  <text x="192.5" y="108" text-anchor="middle" font-size="34">✉️</text>
  <text x="192.5" y="141" text-anchor="middle" font-size="20" font-weight="800" fill="#2f1f1a">votre e-mail</text>
  <text x="192.5" y="165" text-anchor="middle" font-size="13" fill="#7a655c">point central de plusieurs comptes</text>

  <g transform="translate(35 235)">
    <rect width="145" height="86" rx="18" fill="#ffffff" stroke="#4b2c22" stroke-opacity=".09"/>
    <text x="18" y="33" font-size="23">🏦</text>
    <text x="18" y="58" font-size="15" font-weight="700" fill="#2f1f1a">Banque</text>
  </g>
  <g transform="translate(205 235)">
    <rect width="145" height="86" rx="18" fill="#ffffff" stroke="#4b2c22" stroke-opacity=".09"/>
    <text x="18" y="33" font-size="23">🏛️</text>
    <text x="18" y="58" font-size="15" font-weight="700" fill="#2f1f1a">Administration</text>
  </g>
  <g transform="translate(35 343)">
    <rect width="145" height="86" rx="18" fill="#ffffff" stroke="#4b2c22" stroke-opacity=".09"/>
    <text x="18" y="33" font-size="23">🛒</text>
    <text x="18" y="58" font-size="15" font-weight="700" fill="#2f1f1a">Achats</text>
  </g>
  <g transform="translate(205 343)">
    <rect width="145" height="86" rx="18" fill="#ffffff" stroke="#4b2c22" stroke-opacity=".09"/>
    <text x="18" y="33" font-size="23">👥</text>
    <text x="18" y="58" font-size="15" font-weight="700" fill="#2f1f1a">Comptes</text>
  </g>

  <g transform="translate(43 451)">
    <rect width="72" height="28" rx="14" fill="#2e7c70" fill-opacity=".08"/>
    <text x="36" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7c70">Nom</text>
    <rect x="80" width="92" height="28" rx="14" fill="#c56d2f" fill-opacity=".09"/>
    <text x="126" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#a35829">Téléphone</text>
    <rect x="180" width="82" height="28" rx="14" fill="#8a3f59" fill-opacity=".08"/>
    <text x="221" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#8a3f59">Adresse</text>
  </g>
</g>

<g transform="translate(82 382)" font-family="Arial,Helvetica,sans-serif">
  <rect width="535" height="148" rx="26" fill="#fffaf5" stroke="#4b2c22" stroke-opacity=".10"/>
  <text x="26" y="40" font-size="17" font-weight="800" fill="#2f1f1a">Pourquoi plusieurs adresses e-mail ?</text>
  <text x="26" y="72" font-size="15" fill="#7a655c">Une adresse sensible pour la banque et l’administratif.</text>
  <text x="26" y="100" font-size="15" fill="#7a655c">Une autre pour les achats, réseaux et services courants.</text>
  <text x="26" y="128" font-size="15" fill="#7a655c">Moins de recoupement, moins d’exposition inutile.</text>
</g>

<g transform="translate(82 565)" font-family="Arial,Helvetica,sans-serif">
  <rect width="180" height="46" rx="23" fill="#2e7c70" fill-opacity=".10"/>
  <text x="90" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7c70">Comprendre</text>
  <rect x="196" width="180" height="46" rx="23" fill="#c56d2f" fill-opacity=".10"/>
  <text x="286" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#a35829">Se protéger</text>
  <rect x="392" width="180" height="46" rx="23" fill="#8a3f59" fill-opacity=".09"/>
  <text x="482" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#8a3f59">Agir</text>
</g>
</svg>
