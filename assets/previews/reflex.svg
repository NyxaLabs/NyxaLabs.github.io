<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">NYXA Reflex</title>
<desc id="desc">Aperçu de NYXA Reflex, un entraînement interactif aux arnaques numériques.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8f4eb"/>
    <stop offset=".6" stop-color="#f6f2e9"/>
    <stop offset="1" stop-color="#fff7fb"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#18140c" flood-opacity=".16"/>
  </filter>
</defs>

<rect width="1200" height="675" rx="42" fill="url(#bg)"/>
<circle cx="90" cy="35" r="190" fill="#2457ff" opacity=".10"/>
<circle cx="1130" cy="80" r="210" fill="#ff4f8b" opacity=".09"/>

<g font-family="Arial,Helvetica,sans-serif">
  <rect x="75" y="66" width="246" height="42" rx="21" fill="#ffd928" stroke="#161616" stroke-width="3"/>
  <text x="198" y="93" text-anchor="middle" font-size="16" font-weight="800" fill="#161616">⚡ ENTRAÎNEMENT ANTI-ARNAQUES</text>

  <text x="75" y="180" font-size="65" font-weight="900" fill="#161616">Face au piège,</text>
  <text x="75" y="250" font-size="65" font-weight="900" fill="#2457ff">auriez-vous le bon réflexe ?</text>
  <text x="75" y="302" font-size="22" fill="#66625b">SMS • faux conseiller • e-mail • 2FA • QR code</text>
</g>

<!-- Phone -->
<g transform="translate(770 90) rotate(2 165 245)" filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif">
  <rect x="0" y="0" width="330" height="500" rx="44" fill="#161616"/>
  <rect x="12" y="12" width="306" height="476" rx="34" fill="#f8f5ee"/>
  <rect x="120" y="22" width="90" height="20" rx="10" fill="#161616"/>

  <rect x="36" y="78" width="258" height="180" rx="24" fill="#ffffff" stroke="#161616" stroke-opacity=".10"/>
  <text x="58" y="108" font-size="14" font-weight="800" fill="#66625b">ExpressColis • SMS</text>
  <text x="58" y="143" font-size="18" font-weight="700" fill="#161616">Votre colis n’a pas</text>
  <text x="58" y="169" font-size="18" font-weight="700" fill="#161616">pu être livré.</text>
  <text x="58" y="200" font-size="17" fill="#161616">Frais : 1,49 €</text>
  <rect x="54" y="216" width="222" height="28" rx="9" fill="#f1eee7"/>
  <text x="165" y="235" text-anchor="middle" font-size="11" fill="#655e55">expresscolis-suivi.info/...</text>

  <text x="42" y="315" font-size="18" font-weight="900" fill="#161616">Que faites-vous ?</text>

  <rect x="42" y="340" width="246" height="54" rx="15" fill="#ffffff" stroke="#161616" stroke-width="2"/>
  <circle cx="67" cy="367" r="12" fill="#ffd928"/>
  <text x="67" y="371" text-anchor="middle" font-size="11" font-weight="800" fill="#161616">A</text>
  <text x="91" y="371" font-size="14" font-weight="700" fill="#161616">Je clique et je paie</text>

  <rect x="42" y="407" width="246" height="54" rx="15" fill="#eaf0ff" stroke="#2457ff" stroke-width="2"/>
  <circle cx="67" cy="434" r="12" fill="#2457ff"/>
  <text x="67" y="438" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">B</text>
  <text x="91" y="438" font-size="14" font-weight="700" fill="#161616">Je vérifie autrement</text>
</g>

<!-- Floating stickers -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="900">
  <g transform="translate(675 115) rotate(-7)">
    <rect width="128" height="52" rx="15" fill="#ffd928" stroke="#161616" stroke-width="3"/>
    <text x="64" y="33" text-anchor="middle" font-size="18" fill="#161616">URGENCE !</text>
  </g>
  <g transform="translate(1035 205) rotate(7)">
    <rect width="122" height="52" rx="15" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="61" y="33" text-anchor="middle" font-size="17" fill="#161616">Code SMS ?</text>
  </g>
  <g transform="translate(680 515) rotate(4)">
    <rect width="140" height="52" rx="15" fill="#ffb9d1" stroke="#161616" stroke-width="3"/>
    <text x="70" y="33" text-anchor="middle" font-size="17" fill="#161616">Lien reçu</text>
  </g>
</g>

<!-- Features -->
<g transform="translate(75 375)" font-family="Arial,Helvetica,sans-serif">
  <rect width="570" height="176" rx="28" fill="#fffdf8" stroke="#161616" stroke-opacity=".12"/>
  <text x="28" y="43" font-size="19" font-weight="900" fill="#161616">3 niveaux • situations interactives • bilan personnalisé</text>

  <rect x="28" y="66" width="150" height="40" rx="20" fill="#dfe6ff"/>
  <text x="103" y="92" text-anchor="middle" font-size="14" font-weight="800" fill="#2457ff">🌱 Initiation</text>

  <rect x="190" y="66" width="150" height="40" rx="20" fill="#fff1b4"/>
  <text x="265" y="92" text-anchor="middle" font-size="14" font-weight="800" fill="#9c7200">🎯 Réaliste</text>

  <rect x="352" y="66" width="160" height="40" rx="20" fill="#f0e8ff"/>
  <text x="432" y="92" text-anchor="middle" font-size="14" font-weight="800" fill="#7f57ff">🧠 Réflexe+</text>

  <text x="28" y="139" font-size="15" fill="#66625b">Apprendre à vérifier, pas à paniquer.</text>
</g>

<g transform="translate(75 585)" font-family="Arial,Helvetica,sans-serif">
  <rect width="178" height="48" rx="24" fill="#2457ff"/>
  <text x="89" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Tester ses réflexes</text>

  <rect x="190" width="178" height="48" rx="24" fill="#ffd928"/>
  <text x="279" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#161616">Comprendre</text>

  <rect x="380" width="178" height="48" rx="24" fill="#ff4f8b"/>
  <text x="469" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Progresser</text>
</g>
</svg>
